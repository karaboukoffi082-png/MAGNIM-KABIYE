{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Créer un compte — KabiyèBooks{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-logo mb-2">📚 KabiyèBooks</div>
                        <h2 class="h4 fw-bold">Créer un compte</h2>
                        <p class="text-muted small">Rejoignez notre communauté de lecteurs africains</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-kb-primary w-100 py-2 mt-2">
                            <i class="bi bi-person-plus me-2"></i>Créer mon compte
                        </button>
                    </form>
                    <hr>
                    <p class="text-center text-muted small mb-0">
                        Déjà inscrit ? <a href="{% url 'connexion' %}" class="text-kb-green fw-semibold">Se connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
