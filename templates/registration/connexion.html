{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Connexion — KabiyèBooks{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-logo mb-2">📚 KabiyèBooks</div>
                        <h2 class="h4 fw-bold">Connexion</h2>
                        <p class="text-muted small">Bienvenue ! Accédez à votre compte.</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-kb-gold w-100 py-2 mt-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                        </button>
                    </form>
                    <hr>
                    <p class="text-center text-muted small mb-0">
                        Pas encore inscrit ? <a href="{% url 'inscription' %}" class="text-kb-green fw-semibold">Créer un compte</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
